name: Attach verified release archive
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
      ref:
        description: Commit to archive
        required: true
permissions:
  contents: write
jobs:
  attach:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[attach-v6.1.0]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'b555d6fc7357a6f79474eaaeae3df4aa149996cf' }}
          fetch-depth: 1
      - name: Build source archive from the exact release commit
        run: |
          git archive --format=zip --prefix=POS-v6.1.0/ -o POS-v6.1.0-FINAL-VERIFIED.zip HEAD
          sha256sum POS-v6.1.0-FINAL-VERIFIED.zip
      - name: Attach to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag || 'v6.1.0' }}" POS-v6.1.0-FINAL-VERIFIED.zip --clobber
      - name: Download the published asset and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-download
          gh release download "${{ inputs.tag || 'v6.1.0' }}" --pattern POS-v6.1.0-FINAL-VERIFIED.zip --dir release-download
          sha256sum POS-v6.1.0-FINAL-VERIFIED.zip release-download/POS-v6.1.0-FINAL-VERIFIED.zip
          cmp POS-v6.1.0-FINAL-VERIFIED.zip release-download/POS-v6.1.0-FINAL-VERIFIED.zip
